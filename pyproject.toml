[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "calculus-studio"
version = "0.1.0"
description = "Semantica-powered, application-scoped course question-answering platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "celery[redis]>=5.5,<6", "sympy==1.14.0",
  "networkx>=3.4,<4", "cryptography>=44,<48", "pypdf>=5,<7",
  "python-docx>=1.1,<2", "python-pptx>=1.0,<2",
  "pillow>=12,<13",
  "PyYAML>=6,<7",
  "semantica[parse-pdf,llm-openai,llm-ollama]==0.7.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "playwright>=1.51,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["skills/**/*.md", "skills/**/*.txt", "skills/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
